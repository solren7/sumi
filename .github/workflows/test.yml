name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration tests need real backends: the behaviour they guard lives in
    # SQL and in Redis cache invalidation.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sumi
          POSTGRES_DB: sumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_DSN: postgres://postgres:sumi@localhost:5432/sumi?sslmode=disable
      TEST_DB_DSN: postgres://postgres:sumi@localhost:5432/sumi?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd config internal middleware pkg)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Migrate
        run: go run main.go migrate

      - name: Test
        run: go test ./... -count=1

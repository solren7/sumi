services:
  sumi:
    image: ghcr.io/solren7/sumi:latest
    # 本地构建改用: build: .
    container_name: sumi
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_DSN: "postgres://user:123456@postgres:5432/sumi?sslmode=disable"
      REDIS_URL: "redis://cache:6379/1"
      SERVER_PORT: ":3000"
      AUTO_MIGRATE: "true"
      PRODUCTION: "true"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in .env}"
      API_KEY_PEPPER: "${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}"
      ALLOWED_ORIGINS: "*"
      DEFAULT_CURRENCY: "CNY"
      DEFAULT_TIMEZONE: "Asia/Shanghai"
      TZ: "Asia/Shanghai"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - common

networks:
  common:
    external: true
